<noscript><div style="max-width:760px;margin:0 auto;padding:32px 24px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.6;color:#0B1530"><header><a href="/"><img src="assets/ays-logo-horizontal-navy.png" alt="AYS Corp" width="124" height="26"></a> <a href="/">Volver a la página principal</a><nav><a href="/aviso-legal">Aviso legal</a> · <a href="/politica-de-privacidad">Política de privacidad</a> · <a href="/politica-de-cookies">Política de cookies</a> · <a href="/terminos-del-servicio">Términos del servicio</a></nav></header><main><h1>Política de privacidad</h1><p><em>Este texto se ha preparado a partir de la información verificable disponible y no constituye asesoramiento jurídico. Los apartados marcados como pendientes deben completarlos el titular y revisarlos un profesional antes de considerar definitivo el documento.</em></p><p>Esta política explica qué datos personales se recogen a través de este sitio, para qué se utilizan y qué derechos tienes, conforme al Reglamento (UE) 2016/679 (RGPD) y la normativa de protección de datos aplicable.</p><section><h2>1. Responsable del tratamiento</h2><p><strong>Responsable:</strong> [Pendiente] Razón social completa de AYS Corp</p><p><strong>NIF / CIF:</strong> [Pendiente] Pendiente</p><p><strong>Domicilio:</strong> [Pendiente] Pendiente</p><p><strong>Contacto:</strong> info@ayscorp.online</p><p><strong>Delegado de protección de datos:</strong> [Pendiente] Indicar si se ha designado y su contacto</p></section><section><h2>2. Datos que tratamos</h2><p>A través del formulario de demo: nombre y apellidos, email corporativo, empresa, sector, volumen mensual de documentos, plan de interés y el mensaje opcional que escribas. Si nos escribes a info@ayscorp.online, los datos incluidos en tu email.</p><p>Datos técnicos de conexión (como la dirección IP) que el proveedor de alojamiento puede registrar para servir el sitio y garantizar su seguridad.</p><p>[Pendiente] Confirmar qué registros técnicos conserva el proveedor de alojamiento y durante cuánto tiempo.</p></section><section><h2>3. Finalidades</h2><p>Gestionar tu solicitud de demo, contactar contigo para organizarla y responder a tus consultas. No utilizamos estos datos para enviarte comunicaciones comerciales sin un consentimiento específico, ni para tomar decisiones automatizadas con efectos jurídicos sobre ti.</p></section><section><h2>4. Base jurídica</h2><p>Tu consentimiento al enviar la solicitud (art. 6.1.a RGPD) y la aplicación, a petición tuya, de medidas precontractuales (art. 6.1.b RGPD). Puedes retirar tu consentimiento en cualquier momento sin que ello afecte a la licitud del tratamiento previo.</p></section><section><h2>5. Plazo de conservación</h2><p>[Pendiente] Definir durante cuánto tiempo se conservan los datos de solicitudes de demo y comunicaciones, y los criterios de bloqueo y supresión.</p></section><section><h2>6. Destinatarios y encargados del tratamiento</h2><p>No vendemos ni cedemos tus datos. Pueden acceder a ellos proveedores que nos prestan servicios técnicos, bajo contrato de encargo del tratamiento.</p><p>[Pendiente] Alojamiento web: confirmar proveedor (el sitio está preparado para desplegarse en Vercel) y región de servicio.</p><p>[Pendiente] Servicio de envío de formularios: aún no conectado. Indicar el proveedor cuando se integre.</p><p>[Pendiente] Proveedor de correo electrónico de info@ayscorp.online.</p><p>El sitio carga tipografías desde Google Fonts, por lo que el navegador transmite tu dirección IP a Google al visitarlo. Se recomienda alojar las fuentes en el propio servidor.</p></section><section><h2>7. Transferencias internacionales</h2><p>[Pendiente] Algunos proveedores (por ejemplo, Vercel o Google) son empresas estadounidenses. Confirmar si existen transferencias fuera del EEE y las garantías aplicables (Marco de Privacidad de Datos UE-EE. UU. o cláusulas contractuales tipo).</p></section><section><h2>8. Datos tratados dentro de Cuadra</h2><p>Cuando un cliente sube documentos a Cuadra, AYS Corp los trata por cuenta del cliente como encargado del tratamiento, conforme al art. 28 RGPD y al contrato correspondiente. Cuadra utiliza servidores ubicados en la UE.</p><p>[Pendiente] Publicar o referenciar el contrato de encargo del tratamiento (DPA) y la lista de subencargados.</p></section><section><h2>9. Tus derechos</h2><p>Puedes ejercer tus derechos de acceso, rectificación, supresión, oposición, limitación del tratamiento y portabilidad escribiendo a info@ayscorp.online, indicando el derecho que ejerces. Si consideras que no hemos atendido correctamente tu solicitud, puedes reclamar ante la autoridad de control competente; en España, la Agencia Española de Protección de Datos (www.aepd.es).</p></section><section><h2>10. Seguridad</h2><p>[Pendiente] Describir únicamente las medidas técnicas y organizativas efectivamente implantadas (cifrado, control de accesos, registros de auditoría, copias de seguridad).</p></section><section><h2>11. Cambios en esta política</h2><p>Cualquier cambio relevante se publicará en esta página con su fecha de actualización.</p></section></main><footer><a href="mailto:info@ayscorp.online">info@ayscorp.online</a> · © 2026 Cuadra. Todos los derechos reservados.</footer></div></noscript>
