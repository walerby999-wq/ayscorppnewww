<noscript><div style="max-width:760px;margin:0 auto;padding:32px 24px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.6;color:#0B1530"><header><a href="/"><img src="assets/ays-logo-horizontal-navy.png" alt="AYS Corp" width="124" height="26"></a> <a href="/">Volver a la página principal</a><nav><a href="/aviso-legal">Aviso legal</a> · <a href="/politica-de-privacidad">Política de privacidad</a> · <a href="/politica-de-cookies">Política de cookies</a> · <a href="/terminos-del-servicio">Términos del servicio</a></nav></header><main><h1>Términos del servicio</h1><p>Última actualización: 12 de octubre de 2026</p><p>Estos términos regulan la contratación y el uso de Cuadra, la plataforma SaaS de auditoría y conciliación financiera automatizada de AYS Corp, por parte de empresas y profesionales.</p><section><h2>1. Partes y aceptación</h2><p>El servicio lo presta AYS Corp, cuyos datos figuran en el Aviso legal. Al contratar Cuadra, el cliente acepta estos términos y, en su caso, las condiciones particulares de su propuesta comercial.</p></section><section><h2>2. Descripción del servicio</h2><p>Cuadra utiliza inteligencia artificial para interpretar y extraer datos de documentos (facturas, albaranes, cobros, extractos bancarios) y un motor matemático determinista para realizar los cálculos de conciliación.</p><p>Los resultados son una herramienta de apoyo: el cliente es responsable de revisar las incidencias y validar la información antes de utilizarla con fines contables, fiscales o de auditoría. Cuadra no sustituye el asesoramiento profesional.</p></section><section><h2>3. Planes y precios</h2><p><strong>Comercios:</strong> 89 € / mes · hasta 500 documentos al mes</p><p><strong>Clínicas:</strong> 149 € / mes · hasta 2.000 documentos al mes</p><p><strong>Enterprise:</strong> Precio a medida según contrato</p><p><strong>Pago anual:</strong> 20 % de descuento: 71,20 € / mes (854,40 € al año) y 119,20 € / mes (1.430,40 € al año)</p><p><strong>Impuestos:</strong> Precios sin IVA</p></section><section><h2>4. Periodo de prueba</h2><p>Actualmente no se ofrece un periodo de prueba gratuito. Puedes solicitar una demo sin coste y sin tarjeta.</p></section><section><h2>5. Facturación y pago</h2><p>Las suscripciones se facturan por adelantado, mensual o anualmente según la modalidad elegida, y se renuevan automáticamente por periodos iguales salvo cancelación. Si se supera el límite de documentos del plan, te propondremos el cambio al plan adecuado antes de aplicar cualquier cargo adicional.</p></section><section><h2>6. Duración, cancelación y baja</h2><p>No hay permanencia. Puedes cancelar en cualquier momento escribiendo a info@ayscorp.online; la baja será efectiva al final del periodo ya facturado y no se reembolsan periodos parciales. Durante los 30 días siguientes a la baja podrás solicitar la exportación de tus datos; pasado ese plazo, se suprimirán.</p></section><section><h2>7. Datos del cliente</h2><p>El cliente conserva la titularidad de sus documentos y datos. AYS Corp los trata como encargado del tratamiento únicamente para prestar el servicio, conforme al art. 28 RGPD.</p><p>El contrato de encargo del tratamiento (DPA) está disponible a petición en info@ayscorp.online.</p></section><section><h2>8. Soporte y disponibilidad</h2><p>El soporte se presta por email (plan Comercios), con prioridad (plan Clínicas) o con gestor dedicado (Enterprise), según el plan contratado.</p><p>El soporte se atiende en días laborables. No se garantiza un nivel de disponibilidad (SLA) salvo que se pacte expresamente en un contrato Enterprise.</p></section><section><h2>9. Uso aceptable</h2><p>El cliente se compromete a subir solo documentos sobre los que tenga legitimación y a no utilizar el servicio con fines ilícitos.</p></section><section><h2>10. Limitación de responsabilidad</h2><p>AYS Corp responde de los daños causados por dolo o negligencia grave. En los demás casos, su responsabilidad total se limita al importe abonado por el cliente en los 12 meses anteriores al hecho que la origine. AYS Corp no responde de decisiones contables, fiscales o de negocio tomadas a partir de los resultados sin la revisión del cliente.</p></section><section><h2>11. Modificaciones</h2><p>Los cambios en estos términos o en los precios se comunicarán por email con al menos 30 días de antelación. Si no estás de acuerdo, podrás cancelar antes de que entren en vigor.</p></section><section><h2>12. Ley aplicable y jurisdicción</h2><p>Estos términos se rigen por la legislación española. Las partes se someten a los juzgados y tribunales del domicilio del titular, salvo que la ley establezca otro fuero de forma imperativa.</p></section></main><footer><a href="mailto:info@ayscorp.online">info@ayscorp.online</a> · © 2026 Cuadra. Todos los derechos reservados.</footer></div></noscript>
