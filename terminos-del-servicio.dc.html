<noscript><div style="max-width:760px;margin:0 auto;padding:32px 24px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.6;color:#0B1530"><header><a href="/"><img src="assets/ays-logo-horizontal-navy.png" alt="AYS Corp" width="124" height="26"></a> <a href="/">Volver a la página principal</a><nav><a href="/aviso-legal">Aviso legal</a> · <a href="/politica-de-privacidad">Política de privacidad</a> · <a href="/politica-de-cookies">Política de cookies</a> · <a href="/terminos-del-servicio">Términos del servicio</a></nav></header><main><h1>Términos del servicio</h1><p><em>Este texto se ha preparado a partir de la información verificable disponible y no constituye asesoramiento jurídico. Los apartados marcados como pendientes deben completarlos el titular y revisarlos un profesional antes de considerar definitivo el documento.</em></p><p>Estos términos regulan la contratación y el uso de Cuadra, la plataforma SaaS de auditoría y conciliación financiera automatizada de AYS Corp, por parte de empresas y profesionales.</p><section><h2>1. Partes y aceptación</h2><p>El servicio lo presta AYS Corp, cuyos datos figuran en el Aviso legal. Al contratar Cuadra, el cliente acepta estos términos y, en su caso, las condiciones particulares de su propuesta comercial.</p></section><section><h2>2. Descripción del servicio</h2><p>Cuadra utiliza inteligencia artificial para interpretar y extraer datos de documentos (facturas, albaranes, cobros, extractos bancarios) y un motor matemático determinista para realizar los cálculos de conciliación.</p><p>Los resultados son una herramienta de apoyo: el cliente es responsable de revisar las incidencias y validar la información antes de utilizarla con fines contables, fiscales o de auditoría. Cuadra no sustituye el asesoramiento profesional.</p></section><section><h2>3. Planes y precios</h2><p><strong>Comercios:</strong> 89 € / mes · hasta 500 documentos al mes</p><p><strong>Clínicas:</strong> 149 € / mes · hasta 2.000 documentos al mes</p><p><strong>Enterprise:</strong> Precio a medida según contrato</p><p><strong>Pago anual:</strong> 20 % de descuento: 71,20 € / mes (854,40 € al año) y 119,20 € / mes (1.430,40 € al año)</p><p><strong>Impuestos:</strong> Precios sin IVA</p></section><section><h2>4. Periodo de prueba</h2><p>[Pendiente] Definir si existe un periodo de prueba, su duración y condiciones. Mientras no se defina, no se ofrece prueba gratuita; solicitar una demo no requiere tarjeta.</p></section><section><h2>5. Facturación y pago</h2><p>[Pendiente] Definir medios de pago, momento de cobro, renovación automática y tratamiento de excesos sobre el límite de documentos del plan.</p></section><section><h2>6. Duración, cancelación y baja</h2><p>[Pendiente] Definir el periodo de permanencia (si existe), el preaviso de cancelación, el reembolso en planes anuales y el plazo para exportar los datos tras la baja.</p></section><section><h2>7. Datos del cliente</h2><p>El cliente conserva la titularidad de sus documentos y datos. AYS Corp los trata como encargado del tratamiento únicamente para prestar el servicio, conforme al art. 28 RGPD.</p><p>[Pendiente] Adjuntar el contrato de encargo del tratamiento (DPA).</p></section><section><h2>8. Soporte y disponibilidad</h2><p>El soporte se presta por email (plan Comercios), con prioridad (plan Clínicas) o con gestor dedicado (Enterprise), según el plan contratado.</p><p>[Pendiente] Definir horarios de soporte y, en su caso, compromisos de disponibilidad (SLA).</p></section><section><h2>9. Uso aceptable</h2><p>El cliente se compromete a subir solo documentos sobre los que tenga legitimación y a no utilizar el servicio con fines ilícitos.</p></section><section><h2>10. Limitación de responsabilidad</h2><p>[Pendiente] Definir el alcance y los límites de responsabilidad de AYS Corp.</p></section><section><h2>11. Modificaciones</h2><p>[Pendiente] Definir cómo y con qué antelación se comunicarán cambios en los términos o en los precios.</p></section><section><h2>12. Ley aplicable y jurisdicción</h2><p>[Pendiente] Indicar la legislación aplicable y los tribunales competentes.</p></section></main><footer><a href="mailto:info@ayscorp.online">info@ayscorp.online</a> · © 2026 Cuadra. Todos los derechos reservados.</footer></div></noscript>
