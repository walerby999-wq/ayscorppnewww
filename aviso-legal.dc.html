<noscript><div style="max-width:760px;margin:0 auto;padding:32px 24px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.6;color:#0B1530"><header><a href="/"><img src="assets/ays-logo-horizontal-navy.png" alt="AYS Corp" width="124" height="26"></a> <a href="/">Volver a la página principal</a><nav><a href="/aviso-legal">Aviso legal</a> · <a href="/politica-de-privacidad">Política de privacidad</a> · <a href="/politica-de-cookies">Política de cookies</a> · <a href="/terminos-del-servicio">Términos del servicio</a></nav></header><main><h1>Aviso legal</h1><p><em>Este texto se ha preparado a partir de la información verificable disponible y no constituye asesoramiento jurídico. Los apartados marcados como pendientes deben completarlos el titular y revisarlos un profesional antes de considerar definitivo el documento.</em></p><p>Este aviso regula el acceso y uso del sitio web www.ayscorp.online, a través del cual AYS Corp presenta Cuadra, su plataforma de auditoría y conciliación financiera automatizada, y permite solicitar demostraciones.</p><section><h2>1. Datos identificativos del titular</h2><p>[Pendiente] Si el titular está establecido en España, el artículo 10 de la Ley 34/2002 (LSSI-CE) exige publicar los siguientes datos. Confirmar la jurisdicción aplicable.</p><p><strong>Titular:</strong> [Pendiente] Razón social completa y forma jurídica de AYS Corp</p><p><strong>NIF / CIF:</strong> [Pendiente] Pendiente</p><p><strong>Domicilio social:</strong> [Pendiente] Pendiente</p><p><strong>Datos registrales:</strong> [Pendiente] Registro Mercantil, tomo, folio, hoja e inscripción</p><p><strong>Email de contacto:</strong> info@ayscorp.online</p><p><strong>Sitio web:</strong> https://www.ayscorp.online/</p></section><section><h2>2. Objeto del sitio web</h2><p>El sitio ofrece información comercial sobre Cuadra, sus planes y su funcionamiento, y un formulario para solicitar una demostración. Las demostraciones interactivas del sitio utilizan datos ficticios
