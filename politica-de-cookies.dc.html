<noscript><div style="max-width:760px;margin:0 auto;padding:32px 24px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.6;color:#0B1530"><header><a href="/"><img src="assets/ays-logo-horizontal-navy.png" alt="AYS Corp" width="124" height="26"></a> <a href="/">Volver a la página principal</a><nav><a href="/aviso-legal">Aviso legal</a> · <a href="/politica-de-privacidad">Política de privacidad</a> · <a href="/politica-de-cookies">Política de cookies</a> · <a href="/terminos-del-servicio">Términos del servicio</a></nav></header><main><h1>Política de cookies</h1><p><em>Este texto se ha preparado a partir de la información verificable disponible y no constituye asesoramiento jurídico. Los apartados marcados como pendientes deben completarlos el titular y revisarlos un profesional antes de considerar definitivo el documento.</em></p><p>Esta política explica qué cookies y tecnologías similares utiliza este sitio. A fecha de esta versión, el sitio no instala cookies analíticas, publicitarias ni de personalización de terceros, por lo que no muestra un banner de consentimiento.</p><section><h2>1. Qué son las cookies</h2><p>Las cookies y tecnologías similares (como el almacenamiento local del navegador) son pequeños archivos o registros que un sitio guarda en tu dispositivo para recordar información.</p></section><section><h2>2. Tecnologías que utiliza este sitio</h2><p><strong>Nombre:</strong> cuadra_lang</p><p><strong>Tipo:</strong> Almacenamiento local (localStorage), propio</p><p><strong>Finalidad:</strong> Recordar el idioma que has elegido (ES / EN)</p><p><strong>Duración:</strong> Hasta que borres los datos del sitio en tu navegador</p><p><strong>Categoría:</strong> Técnica, solicitada por el usuario. Exenta de consentimiento (art. 22.2 LSSI-CE)</p></section><section><h2>3. Recursos de terceros</h2><p>El sitio carga tipografías desde Google Fonts (fonts.googleapis.com y fonts.gstatic.com). Este servicio recibe tu dirección IP para entregar los archivos.</p><p>[Pendiente] Verificar que el proveedor de alojamiento no tiene activada ninguna herramienta de analítica o medición (por ejemplo, Vercel Web Analytics). Si se activa, deberá implantarse un sistema de consentimiento previo.</p></section><section><h2>4. Consentimiento</h2><p>Como el sitio no utiliza cookies no esenciales, no se solicita consentimiento. Si en el futuro se incorporan herramientas analíticas o de marketing, se añadirá un panel que permita aceptarlas, rechazarlas, configurarlas por categorías y retirar el consentimiento en cualquier momento, y no se cargarán antes de que des tu consentimiento.</p></section><section><h2>5. Cómo gestionar o eliminar estos datos</h2><p>Puedes eliminar el almacenamiento local y las cookies desde la configuración de privacidad de tu navegador. Si borras «cuadra_lang», el sitio volverá a mostrarse en el idioma predeterminado.</p></section><section><h2>6. Cambios</h2><p>Actualizaremos esta política si cambian las tecnologías utilizadas.</p></section></main><footer><a href="mailto:info@ayscorp.online">info@ayscorp.online</a> · © 2026 Cuadra. Todos los derechos reservados.</footer></div></noscript>
