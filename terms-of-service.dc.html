l billing:</strong> 20% discount: €71.20 / month (€854.40 per year) and €119.20 / month (€1,430.40 per year)</p><p><strong>Taxes:</strong> Prices exclude VAT</p></section><section><h2>4. Trial period</h2><p>[Pending] Define whether a trial period exists, its length and conditions. Until defined, no free trial is offered; requesting a demo does not require a card.</p></section><section><h2>5. Billing and payment</h2><p>[Pending] Define payment methods, billing timing, automatic renewal and handling of usage above the plan’s document limit.</p></section><section><h2>6. Term, cancellation and termination</h2><p>[Pending] Define any minimum term, cancellation notice, refunds on annual plans and the window to export data after termination.</p></section><section><h2>7. Customer data</h2><p>The customer retains ownership of their documents and data. AYS Corp processes them as a processor solely to provide the service, under Art. 28 GDPR.</p><p>[Pending] Attach the data processing agreement (DPA).</p></section><section><h2>8. Support and availability</h2><p>Support is provided by email (Retail), with priority (Clinics) or through a dedicated account manager (Enterprise), depending on the plan.</p><p>[Pending] Define support hours and any availability commitments (SLA).</p></section><section><h2>9. Acceptable use</h2><p>The customer agrees to upload only documents they are entitled to process and not to use the service for unlawful purposes.</p></section><section><h2>10. Limitation of liability</h2><p>[Pending] Define the scope and limits of AYS Corp’s liability.</p></section><section><h2>11. Changes</h2><p>[Pending] Define how and with what notice changes to the terms or prices will be communicated.</p></section><section><h2>12. Governing law and jurisdiction</h2><p>[Pending] State the governing law and competent courts.</p></section></main><footer><a href="mailto:info@ayscorp.online">info@ayscorp.online</a> · © 2026 Cuadra. All rights reserved.</footer></div></noscript>
