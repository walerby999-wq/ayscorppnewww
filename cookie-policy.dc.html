<noscript><div style="max-width:760px;margin:0 auto;padding:32px 24px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.6;color:#0B1530"><header><a href="/en"><img src="assets/ays-logo-horizontal-navy.png" alt="AYS Corp" width="124" height="26"></a> <a href="/en">Back to the home page</a><nav><a href="/legal-notice">Legal notice</a> · <a href="/privacy-policy">Privacy policy</a> · <a href="/cookie-policy">Cookie policy</a> · <a href="/terms-of-service">Terms of service</a></nav></header><main><h1>Cookie policy</h1><p>Last updated: 12 October 2026</p><p>This policy explains which cookies and similar technologies this site uses. It sets no advertising or third-party cookies; visit and performance measurement only runs with your consent.</p><section><h2>1. What cookies are</h2><p>Cookies and similar technologies (such as the browser’s local storage) are small files or records a site stores on your device to remember information.</p></section><section><h2>2. Technologies used on this site</h2><p><strong>Name:</strong> cuadra_lang</p><p><strong>Type:</strong> Local storage (localStorage), first-party</p><p><strong>Purpose:</strong> Remember the language you chose (ES / EN)</p><p><strong>Duration:</strong> Until you clear the site’s data in your browser</p><p><strong>Category:</strong> Technical, requested by the user. Exempt from consent (Art. 22.2 LSSI-CE)</p><p><strong>Name:</strong> cuadra_consent</p><p><strong>Purpose:</strong> Remember whether you accept or reject measurement (granted / denied)</p><p><strong>Category:</strong> Technical, required to manage your consent</p></section><section><h2>3. Third-party resources</h2><p>The site loads fonts from Google Fonts (fonts.googleapis.com and fonts.gstatic.com). This service receives your IP address to deliver the files.</p><p>With your consent, the site uses Vercel Web Analytics and Vercel Speed Insights (Vercel Inc.) to count visits and measure performance in aggregate. They set no cookies or persistent identifiers and do not load until you accept.</p></section><section><h2>4. Consent</h2><p>On your first visit a notice lets you accept, reject or configure measurement. No measurement tool loads until you accept. You can change or withdraw consent at any time from “Cookie preferences” in the footer.</p></section><section><h2>5. Managing or deleting this data</h2><p>You can delete local storage and cookies from your browser’s privacy settings. If you delete “cuadra_lang”, the site will show in its default language again.</p></section><section><h2>6. Changes</h2><p>We will update this policy if the technologies used change.</p></section></main><footer><a href="mailto:info@ayscorp.online">info@ayscorp.online</a> · © 2026 Cuadra. All rights reserved.</footer></div></noscript>
