<noscript><div style="max-width:760px;margin:0 auto;padding:32px 24px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.6;color:#0B1530"><header><a href="/en"><img src="assets/ays-logo-horizontal-navy.png" alt="AYS Corp" width="124" height="26"></a> <a href="/en">Back to the home page</a><nav><a href="/legal-notice">Legal notice</a> · <a href="/privacy-policy">Privacy policy</a> · <a href="/cookie-policy">Cookie policy</a> · <a href="/terms-of-service">Terms of service</a></nav></header><main><h1>Privacy policy</h1><p><em>This text has been prepared from the verifiable information available and does not constitute legal advice. Sections marked as pending must be completed by the owner and reviewed by a professional before the document is considered final. The Spanish version prevails.</em></p><p>This policy explains what personal data is collected through this site, what it is used for and what rights you have, under Regulation (EU) 2016/679 (GDPR) and applicable data protection law.</p><section><h2>1. Data controller</h2><p><strong>Controller:</strong> [Pending] Full legal name of AYS Corp</p><p><strong>Tax ID:</strong> [Pending] Pending</p><p><strong>Address:</strong> [Pending] Pending</p><p><strong>Contact:</strong> info@ayscorp.online</p><p><strong>Data protection officer:</strong> [Pending] State whether one has been appointed and their contact details</p></section><section><h2>2. Data we process</h2><p>Through the demo form: full name, work email, company, industry, monthly document volume, plan of interest and any optional message. If you email info@ayscorp.online, the data included in your email.</p><p>Technical connection data (such as IP address) that the hosting provider may log to serve the site and keep it secure.</p><p>[Pending] Confirm which technical logs the hosting provider keeps and for how long.</p></section><section><h2>3. Purposes</h2><p>To handle your demo request, contact you to arrange it and answer your questions. We do not use this data to send you marketing without specific consent, nor to make automated decisions with legal effects on you.</p></section><section><h2>4. Legal basis</h2><p>Your consent when submitting the request (Art. 6.1.a GDPR) and taking pre-contractual steps at your request (Art. 6.1.b GDPR). You may withdraw consent at any time without affecting the lawfulness of prior processing.</p></section><section><h2>5. Retention period</h2><p>[Pending] Define how long demo request and communication data is kept, and the criteria for blocking and deletion.</p></section><section><h2>6. Recipients and processors</h2><p>We do not sell or share your data. Providers delivering technical services may access it under a data processing agreement.</p><p>[Pending] Web hosting: confirm the provider (the site is prepared for deployment on Vercel) and service region.</p><p>[Pending] Form submission service: not yet connected. Name the provider once integrated.</p><p>[Pending] Email provider for info@ayscorp.online.</p><p>The site loads fonts from Google Fonts, so your browser sends your IP address to Google when you visit. Self-hosting the fonts is recommended.</p></section><section><h2>7. International transfers</h2><p>[Pending] Some providers (e.g. Vercel or Google) are US companies. Confirm whether data is transferred outside the EEA and the safeguards applied (EU-US Data Privacy Framework or standard contractual clauses).</p></section><section><h2>8. Data processed within Cuadra</h2><p>When a customer uploads documents to Cuadra, AYS Corp processes them on the customer’s behalf as a processor, under Art. 28 GDPR and the relevant contract. Cuadra uses servers located in the EU.</p><p>[Pending] Publish or reference the data processing agreement (DPA) and the list of sub-processors.</p></section><section><h2>9. Your rights</h2><p>You can exercise your rights of access, rectification, erasure, objection, restriction and portability by emailing info@ayscorp.online and stating the right you are exercising. If you believe your request has not been handled properly, you may complain to the competent supervisory authority; in Spain, the Agencia Española de Protección de Datos (www.aepd.es).</p></section><section><h2>10. Security</h2><p>[Pending] Describe only the technical and organizational measures actually in place (encryption, access control, audit logs, backups).</p></section><section><h2>11. Changes to this policy</h2><p>Any significant change will be published on this page with its update date.</p></section></main><footer><a href="mailto:info@ayscorp.online">info@ayscorp.online</a> · © 2026 Cuadra. All rights reserved.</footer></div></noscript>
