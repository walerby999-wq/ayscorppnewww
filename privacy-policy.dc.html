<noscript><div style="max-width:760px;margin:0 auto;padding:32px 24px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.6;color:#0B1530"><header><a href="/en"><img src="assets/ays-logo-horizontal-navy.png" alt="AYS Corp" width="124" height="26"></a> <a href="/en">Back to the home page</a><nav><a href="/legal-notice">Legal notice</a> · <a href="/privacy-policy">Privacy policy</a> · <a href="/cookie-policy">Cookie policy</a> · <a href="/terms-of-service">Terms of service</a></nav></header><main><h1>Privacy policy</h1><p>Last updated: 12 October 2026</p><p>This policy explains what personal data is collected through this site, what it is used for and what rights you have, under Regulation (EU) 2016/679 (GDPR) and applicable data protection law.</p><section><h2>1. Data controller</h2><p><strong>Controller:</strong> Arnau González Ruhí</p><p><strong>Tax ID (NIF):</strong> 23921740S</p><p><strong>Address:</strong> C/ Anselm Clavé, 22, 08339 Vilassar de Dalt (Barcelona), Spain</p><p><strong>Contact:</strong> info@ayscorp.online</p><p><strong>Data protection officer:</strong> Not appointed. For any privacy matter, email info@ayscorp.online</p></section><section><h2>2. Data we process</h2><p>Through the demo form: full name, work email, company, industry, monthly document volume, plan of interest and any optional message. If you email info@ayscorp.online, the data included in your email.</p><p>Technical connection data (such as IP address) that the hosting provider may log to serve the site and keep it secure.</p></section><section><h2>3. Purposes</h2><p>To handle your demo request, contact you to arrange it and answer your questions. We do not use this data to send you marketing without specific consent, nor to make automated decisions with legal effects on you.</p></section><section><h2>4. Legal basis</h2><p>Your consent when submitting the request (Art. 6.1.a GDPR) and taking pre-contractual steps at your request (Art. 6.1.b GDPR). You may withdraw consent at any time without affecting the lawfulness of prior processing.</p></section><section><h2>5. Retention period</h2><p>Demo request data is kept for 12 months from the last contact if no subscription follows, and is then deleted. If you subscribe to Cuadra, it is kept for the duration of the contract and, afterwards, blocked for the periods required by law (e.g. tax and commercial obligations). You can ask for earlier deletion at any time.</p></section><section><h2>6. Recipients and processors</h2><p>We do not sell or share your data. Providers delivering technical services may access it under a data processing agreement.</p><p>Demo form delivery: Resend (Resend, Inc.), which delivers the request to info@ayscorp.online.</p><p>The site loads fonts from Google Fonts, so your browser sends your IP address to Google when you visit. Self-hosting the fonts is recommended.</p><p>Vercel Inc.: web hosting and, only with your consent, Web Analytics and Speed Insights.</p><p>Email provider for info@ayscorp.online, to receive and answer your messages.</p></section><section><h2>7. International transfers</h2><p>Some providers (Vercel, Resend and Google) are based in the United States. Where their services involve transfers outside the European Economic Area, these rely on the EU-US Data Privacy Framework or standard contractual clauses approved by the European Commission.</p></section><section><h2>8. Data processed within Cuadra</h2><p>When a customer uploads documents to Cuadra, AYS Corp processes them on the customer’s behalf as a processor, under Art. 28 GDPR and the relevant contract. Cuadra uses servers located in the EU.</p><p>The data processing agreement and the list of sub-processors are available to customers at info@ayscorp.online.</p></section><section><h2>9. Your rights</h2><p>You can exercise your rights of access, rectification, erasure, objection, restriction and portability by emailing info@ayscorp.online and stating the right you are exercising. If you believe your request has not been handled properly, you may complain to the competent supervisory authority; in Spain, the Agencia Española de Protección de Datos (www.aepd.es).</p></section><section><h2>10. Security</h2><p>We apply technical and organizational measures appropriate to the risk, under Article 32 GDPR, to protect data against loss, alteration or unauthorized access. Connections to this site are encrypted with HTTPS.</p></section><section><h2>11. Changes to this policy</h2><p>Any significant change will be published on this page with its update date.</p></section></main><footer><a href="mailto:info@ayscorp.online">info@ayscorp.online</a> · © 2026 Cuadra. All rights reserved.</footer></div></noscript>
