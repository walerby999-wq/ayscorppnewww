s). If one is enabled, a prior-consent system must be implemented.</p></section><section><h2>4. Consent</h2><p>Because the site uses no non-essential cookies, no consent is requested. If analytics or marketing tools are added in the future, a panel will let you accept, reject, configure by category and withdraw consent at any time, and those tools will not load before you consent.</p></section><section><h2>5. Managing or deleting this data</h2><p>You can delete local storage and cookies from your browser’s privacy settings. If you delete “cuadra_lang”, the site will show in its default language again.</p></section><section><h2>6. Changes</h2><p>We will update this policy if the technologies used change.</p></section></main><footer><a href="mailto:info@ayscorp.online">info@ayscorp.online</a> · © 2026 Cuadra. All rights reserved.</footer></div></noscript>
