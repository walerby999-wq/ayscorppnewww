<noscript><div style="max-width:760px;margin:0 auto;padding:32px 24px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.6;color:#0B1530"><header><a href="/"><img src="assets/ays-logo-horizontal-navy.png" alt="AYS Corp" width="124" height="26"></a> <a href="/">Volver a la página principal</a><nav><a href="/aviso-legal">Aviso legal</a> · <a href="/politica-de-privacidad">Política de privacidad</a> · <a href="/politica-de-cookies">Política de cookies</a> · <a href="/terminos-del-servicio">Términos del servicio</a></nav></header><main><h1>Política de privacidad</h1><p>Última actualización: 12 de octubre de 2026</p><p>Esta política explica qué datos personales se recogen a través de este sitio, para qué se utilizan y qué derechos tienes, conforme al Reglamento (UE) 2016/679 (RGPD) y la normativa de protección de datos aplicable.</p><section><h2>1. Responsable del tratamiento</h2><p><strong>Responsable:</strong> Arnau González Ruhí</p><p><strong>NIF:</strong> 23921740S</p><p><strong>Domicilio:</strong> C/ Anselm Clavé, 22, 08339 Vilassar de Dalt (Barcelona), España</p><p><strong>Contacto:</strong> info@ayscorp.online</p><p><strong>Delegado de protección de datos:</strong> No designado. Para cualquier cuestión sobre privacidad, escribe a info@ayscorp.online</p></section><section><h2>2. Datos que tratamos</h2><p>A través del formulario de demo: nombre y apellidos, email corporativo, empresa, sector, volumen mensual de documentos, plan de interés y el mensaje opcional que escribas. Si nos escribes a info@ayscorp.online, los datos incluidos en tu email.</p><p>Datos técnicos de conexión (como la dirección IP) que el proveedor de alojamiento puede registrar para servir el sitio y garantizar su seguridad.</p></section><section><h2>3. Finalidades</h2><p>Gestionar tu solicitud de demo, contactar contigo para organizarla y responder a tus consultas. No utilizamos estos datos para enviarte comunicaciones comerciales sin un consentimiento específico, ni para tomar decisiones automatizadas con efectos jurídicos sobre ti.</p></section><section><h2>4. Base jurídica</h2><p>Tu consentimiento al enviar la solicitud (art. 6.1.a RGPD) y la aplicación, a petición tuya, de medidas precontractuales (art. 6.1.b RGPD). Puedes retirar tu consentimiento en cualquier momento sin que ello afecte a la licitud del tratamiento previo.</p></section><section><h2>5. Plazo de conservación</h2><p>Los datos de las solicitudes de demo se conservan durante 12 meses desde el último contacto si no llega a formalizarse una contratación, y después se suprimen. Si contratas Cuadra, se conservan mientras dure la relación contractual y, una vez finalizada, bloqueados durante los plazos que exija la ley (por ejemplo, en materia fiscal y mercantil). Puedes pedir su supresión antes en cualquier momento.</p></section><section><h2>6. Destinatarios y encargados del tratamiento</h2><p>No vendemos ni cedemos tus datos. Pueden acceder a ellos proveedores que nos prestan servicios técnicos, bajo contrato de encargo del tratamiento.</p><p>Envío del formulario de demo: Resend (Resend, Inc.), que entrega la solicitud a info@ayscorp.online.</p><p>El sitio carga tipografías desde Google Fonts, por lo que el navegador transmite tu dirección IP a Google al visitarlo. Se recomienda alojar las fuentes en el propio servidor.</p><p>Vercel Inc.: alojamiento web y, solo con tu consentimiento, Web Analytics y Speed Insights.</p><p>Proveedor de correo electrónico de info@ayscorp.online, para recibir y responder tus mensajes.</p></section><section><h2>7. Transferencias internacionales</h2><p>Algunos proveedores (Vercel, Resend y Google) tienen sede en Estados Unidos. Cuando sus servicios impliquen transferencias fuera del Espacio Económico Europeo, estas se amparan en el Marco de Privacidad de Datos UE-EE. UU. o en cláusulas contractuales tipo aprobadas por la Comisión Europea.</p></section><section><h2>8. Datos tratados dentro de Cuadra</h2><p>Cuando un cliente sube documentos a Cuadra, AYS Corp los trata por cuenta del cliente como encargado del tratamiento, conforme al art. 28 RGPD y al contrato correspondiente. Cuadra utiliza servidores ubicados en la UE.</p><p>El contrato de encargo del tratamiento y la lista de subencargados están a disposición de los clientes en info@ayscorp.online.</p></section><section><h2>9. Tus derechos</h2><p>Puedes ejercer tus derechos de acceso, rectificación, supresión, oposición, limitación del tratamiento y portabilidad escribiendo a info@ayscorp.online, indicando el derecho que ejerces. Si consideras que no hemos atendido correctamente tu solicitud, puedes reclamar ante la autoridad de control competente; en España, la Agencia Española de Protección de Datos (www.aepd.es).</p></section><section><h2>10. Seguridad</h2><p>Aplicamos medidas técnicas y organizativas adecuadas al riesgo, conforme al artículo 32 del RGPD, para proteger los datos frente a pérdida, alteración o acceso no autorizado. Las conexiones con este sitio se cifran mediante HTTPS.</p></section><section><h2>11. Cambios en esta política</h2><p>Cualquier cambio relevante se publicará en esta página con su fecha de actualización.</p></section></main><footer><a href="mailto:info@ayscorp.online">info@ayscorp.online</a> · © 2026 Cuadra. Todos los derechos reservados.</footer></div></noscript>
